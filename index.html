<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currículo</title>

    <style>
      body {
        background-image: linear-gradient(
          to left top,
          #8387f7,
          #5059df,
          #4f4ea0,
          #204168,
          #12213d,
          #0b0a1b,
          #000000,
          #000000,
          #1f081f,
          #68215d,
          #973aa0,
          #ca82f1
        );
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-attachment: fixed;
      }

      * {
        padding: 0;
        margin: 0;
      }

      .foto {
        border: 3px solid #fff;
      }

      h1,
      h2,
      h3,
      p,
      ul,
      li,
      a,
      i {
        color: rgb(255, 255, 255);
        font-family: "Segoe UI";
        padding: 8px;
        flex-wrap: wrap;
        transition-duration: 0.4s;
      }

      .cardDiv {
        border: 2px solid #ffffff;
        border-radius: 25px;
        margin: 30px;
        padding: 30px;
        flex-wrap: wrap;
      }

      button {
        color: rgb(255, 255, 255);
        background-color: #00000000;
        border: 2px solid #ffffff;
        border-radius: 15px;
        padding: 10px;
        margin-bottom: 20px;
        width: 100%;
        text-align: left;
        justify-content: space-between;
        display: flex;
        transition-duration: 0.4s;
      }

      button:hover {
        border: 2px solid #00a2ff;
        h2 {
          color: rgb(0, 162, 255);
        }
        i {
          color: rgb(0, 162, 255);
        }
      }

      .logo {
        width: 50px;
        height: 50px;
        margin: 10px;
      }

      a:link {
        color: rgb(252, 252, 252);
        background-color: transparent;
        text-decoration: none;
      }
      a:visited {
        color: rgb(255, 255, 255);
        background-color: transparent;
        text-decoration: none;
      }
      a:hover {
        color: rgb(255, 255, 255);
        background-color: transparent;
        text-decoration: underline;
      }
      a:active {
        color: rgb(255, 255, 255);
        background-color: transparent;
        text-decoration: underline;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      a,
      p,
      h1,
      h2,
      h3 {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      button h2 {
        flex: 1;
        min-width: 0;
      }
      button i.fa-sort-down {
        flex-shrink: 0;
      }

      @media (max-width: 768px) {
        body {
          background-attachment: scroll;
          background-size: cover;
        }

        .cardDiv {
          margin: 12px;
          padding: 16px;
          border-radius: 18px;
        }

        h1 {
          font-size: 1.5rem;
        }
        h2 {
          font-size: 1.15rem;
        }
        h3 {
          font-size: 1rem;
        }
        p,
        li,
        a {
          font-size: 0.95rem;
        }

        h1,
        h2,
        h3,
        p,
        ul,
        li,
        a,
        i {
          padding: 6px;
        }

        button {
          padding: 8px;
          border-radius: 12px;
          margin-bottom: 14px;
        }

        .logo {
          width: 40px;
          height: 40px;
          margin: 6px;
        }
      }

      @media (max-width: 480px) {
        .cardDiv {
          margin: 8px;
          padding: 12px;
          border-radius: 14px;
        }

        h1 {
          font-size: 1.3rem;
        }

        img[src$="foto.png"] {
          width: 120px;
          height: 120px;
        }

        .logo {
          width: 36px;
          height: 36px;
          margin: 4px;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body>
    <section>
      <div class="cardDiv">
        <div style="text-align: center">
          <img
            class="foto"
            src="assets/foto.png"
            width="150px"
            height="150px"
            style="border-radius: 100%"
          />
          <h1>Heitor dos Santos Soares</h1>
          <p><i class="fa fa-code"></i> Técnico em Informática</p>
          <p><i class="fa fa-birthday-cake"></i> 20/10/2005</p>
          <p><i class="fa fa-map-marker"></i> Leopoldina - Porto Alegre/RS</p>
          <p><i class="fa fa-phone"></i>(51) 99760-7506</p>
          <p><i class="fa fa-envelope"></i> heitordossantossoares@gmail.com</p>
          <p></p>
          <p></p>
        </div>

        <div>
          <button onclick="ExibirDados(4)" id="BotaoExibir4">
            <h2>Formação Acadêmica</h2>
            <i
              id="sortDown4"
              class="fa fa-sort-down"
              style="font-size: x-large"
            ></i>

            <div id="exibir4" style="display: none">
              <h3>Técnico em Informática</h3>
              <p>● Escola Técnica José César de Mesquita</p>
              <p>(Concluído em: 04/2026)</p>
              <h3>Ensino Médio</h3>
              <p>
                ● Escola Estadual de Ensino Médio Baltazar de Oliveira Garcia
              </p>
              <p>(Concluído em: 12/2023)</p>
            </div>
          </button>
        </div>

        <div>
          <button onclick="ExibirDados(3)" id="BotaoExibir3">
            <h2>Idioma</h2>
            <i
              id="sortDown3"
              class="fa fa-sort-down"
              style="font-size: x-large"
            ></i>

            <div id="exibir3" style="display: none">
              <p>● Inglês Intermediário</p>
            </div>
          </button>
        </div>

        <div>
          <button onclick="ExibirDados(1)" id="BotaoExibir1">
            <h2>Ferramentas</h2>
            <i
              id="sortDown1"
              class="fa fa-sort-down"
              style="font-size: x-large"
            ></i>
            <div id="exibir1" style="display: none">
              <h3>● C, Java, Docker, HTML+CSS+JavaScript e MySQL</h3>
              <div style="display: flex; flex-wrap: wrap; border-radius: 8px">
                <img src="assets/C.png" class="logo" />
                <img src="assets/Java.png" class="logo" />
                <img src="assets/docker.png" class="logo" />
                <img src="assets/JavaScript.png" class="logo" />
                <img src="assets/HTML5.png" class="logo" />
                <img src="assets/CSS3.png" class="logo" />
                <img src="assets/MySQL.png" class="logo" />
              </div>
            </div>
          </button>
        </div>

        <div>
          <button onclick="ExibirDados(2)" id="BotaoExibir2">
            <h2>Portfólio</h2>
            <i
              id="sortDown2"
              class="fa fa-sort-down"
              style="font-size: x-large"
            ></i>

            <div id="exibir2" style="display: none">
              <div>
                <h3>● Flappy Bird recriado em Flutter</h3>
                <a
                  href="https://github.com/HeitorSoares54/projeto-mobile-grupo1"
                  >https://github.com/HeitorSoares54/projeto-mobile-grupo1</a
                >
              </div>
              <div>
                <h3>● IaC - Infraestrutura na Azure</h3>
                <a
                  href="https://github.com/HeitorSoares54/iac-trabalho-terraform-ansible"
                  >https://github.com/HeitorSoares54/iac-trabalho-terraform-ansible</a
                >
              </div>
              <div>
                <h3>● Unity - Jogo 3D em Terceira Pessoa</h3>
                <a href="https://github.com/HeitorSoares54/Jogo3dTerceiraPessoa"
                  >https://github.com/HeitorSoares54/Jogo3dTerceiraPessoa</a
                >
              </div>
              <div>
                <h3>● Banco de dados (Escola) - MySQL e Spring Boot</h3>
                <a href="https://github.com/HeitorSoares54/escola_spring_boot"
                  >https://github.com/HeitorSoares54/escola_spring_boot</a
                >
              </div>
            </div>
          </button>
        </div>

        <div>
          <button onclick="ExibirDados(5)" id="BotaoExibir5">
            <h2>Curso</h2>
            <i
              id="sortDown5"
              class="fa fa-sort-down"
              style="font-size: x-large"
            ></i>

            <div id="exibir5" style="display: none">
              <h3>
                ● Jogos 3D na Unity com C# - Do Zero ao Avançado + Multiplayer
                (85h)
              </h3>
              <p>2026 - Em Andamento</p>
            </div>
          </button>
        </div>
      </div>
    </section>
    <script>
      function ExibirDados(n) {
        const botao = document.getElementById("BotaoExibir" + n);
        const conteudo = document.getElementById("exibir" + n);
        const seta = document.getElementById("sortDown" + n);

        const aberto = conteudo.style.display === "grid";

        conteudo.style.display = aberto ? "none" : "grid";
        seta.style.display = aberto ? "block" : "none";
        botao.style.display = aberto ? "flex" : "block";
      }
    </script>
  </body>
</html>
