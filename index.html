      body {

    to left top,

* {

  padding: 0;
  margin: 0;
}

h1,
h2,
h3,
p,
ul,
li,
a,
i {
  color: rgb(255, 255, 255);
  font-family: "Segoe UI";
  padding: 8px;
  flex-wrap: wrap;
}

.cardDiv {
  border: 2px solid #ffffff;
  border-radius: 25px;
  margin: 30px;
  padding: 30px;
  flex-wrap: wrap;
}

button {
  color: rgb(255, 255, 255);
  background-color: #00000000;
  border: 2px solid #ffffff;
  border-radius: 15px;
  padding: 10px;
  margin-bottom: 20px;
  width: 100%;
  text-align: left;
  justify-content: space-between;
  display: flex;
  transition-duration: 0.4s;
}

button:hover {
  border: 2px solid #00a2ff;
  h2 {
    color: rgb(0,162,255);
  }
  i {
    color: rgb(0,162,255);
  }
}

.logo
{
width: 50px;
height: 50px;
margin: 10px;
}

a:link {
  color: rgb(252, 252, 252);
  background-color: transparent;
  text-decoration: none;
}
a:visited {
  color: rgb(255, 255, 255);
  background-color: transparent;
  text-decoration: none;
}
a:hover {
  color: rgb(255, 255, 255);
  background-color: transparent;
  text-decoration: underline;
}
a:active {
  color: rgb(255, 255, 255);
  background-color: transparent;
  text-decoration: underline;
}
